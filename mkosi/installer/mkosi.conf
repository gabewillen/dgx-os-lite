# USB installer: live Debian arm64 that copies DGX-OS-Lite onto NVMe OS
# partitions only. Built after the OS image so ExtraTrees can include
# the extracted rootfs + ESP payload.

[Match]
Image=installer

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64
Mirror=http://deb.debian.org/debian
Repositories=main,contrib,non-free,non-free-firmware

[Output]
Format=disk
Output=dgx-os-lite-installer.raw

[Content]
RootPassword=$6$BfM2k8rqQbUg23.t$VBy.H78CcTtgtpayoX4IiceYwOcQ4Ce7paRwtrPY4H.Dfus1nZ7vGNtjUCaHHdGPaClgaLcKx7/RLgp86kB/E.
Bootable=yes
Bootloader=grub
Hostname=dgx-os-lite-installer

Packages=
    udev
    systemd-standalone-sysusers
    apt
    linux-image-arm64
    initramfs-tools
    grub-efi-arm64
    xfsprogs
    e2fsprogs
    dosfstools
    util-linux
    gdisk
    efibootmgr
    mokutil
    openssh-server
    iproute2
    kmod
    ca-certificates
    curl
    dmidecode
    pciutils
    nvme-cli
    mount
    rsync

PostInstallationScripts=scripts/installer-postinst.chroot
CleanPackageMetadata=yes
