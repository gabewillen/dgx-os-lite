
# dgx-spark-lite — minimal bootable image for NVIDIA DGX Spark (GB10)
#
# Debian trixie, XFS root (via repart), UEFI boot. Flash to USB (dd/Etcher),
# UEFI-boot on DGX Spark. sshd + networkd DHCP + serial console + NVIDIA chain.
#
# Build:  sudo mkosi build   (any Linux host with binfmt; see README)
# Output: mkosi.output/dgx-spark-lite.raw
[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64
Mirror=http://deb.debian.org/debian
Repositories=main,contrib,non-free,non-free-firmware

[Output]
Format=disk
#
# NOTE: mkosi 25.3 has no native ISO format. This GPT disk image is the
# bootable artifact: dd/Rufus/balenaEtcher to USB, UEFI-boot on DGX Spark.
# An ISO9660 wrapper (xorriso) can be layered on for optical media later.

[Content]
RootPassword=$6$BfM2k8rqQbUg23.t$VBy.H78CcTtgtpayoX4IiceYwOcQ4Ce7paRwtrPY4H.Dfus1nZ7vGNtjUCaHHdGPaClgaLcKx7/RLgp86kB/E.
Bootable=yes
Bootloader=grub
#
# XFS root: see mkosi.repart/20-root.conf (repart Format=xfs, since Debian's
# mkosi default root filesystem is ext4).

Packages=
    udev
    systemd-standalone-sysusers
    systemd-standalone-tmpfiles
    finit
    finit-sysv
    finit-plugins
    apt
    linux-image-arm64
    initramfs-tools
    grub-efi-arm64
    xfsprogs
    openssh-server
    mdnsd
    iproute2
    kmod
    ca-certificates
    curl
    wpasupplicant
    dhcpcd
    firmware-iwlwifi
    firmware-realtek
    firmware-misc-nonfree
    firmware-nvidia-gsp
    wireless-regdb
    rdma-core
    libibverbs1
    ibverbs-providers
    librdmacm1

# NVIDIA driver chain: installed from NVIDIA's debian13/sbsa repo in the
# prepare script (Debian ships no nvidia-open for GB10/Blackwell).
PrepareScripts=scripts/prepare.chroot
PostInstallationScripts=scripts/postinst.chroot
CleanPackageMetadata=yes
