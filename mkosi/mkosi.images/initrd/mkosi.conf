# Busybox initrd — no systemd. Used by the OS image via Initrds=.
[Output]
Output=initrd
Format=cpio
ManifestFormat=

[Content]
Bootable=no
MakeInitrd=yes
CleanPackageMetadata=yes
WithDocs=no
Locale=C.UTF-8
Packages=
    busybox
    kmod
    util-linux
    xfsprogs
    e2fsprogs
    dosfstools

RemoveFiles=
    /usr/lib/modules/*/vmlinuz*
    /usr/lib/modules/*/vmlinux*
    /usr/lib/modules/*/System.map
    /var/cache
    /var/log

KernelModulesInclude=
    /virtio_pci.ko
    /virtio_blk.ko
    /virtio_scsi.ko
    /virtio_net.ko
    /virtio_mmio.ko
    /virtio-rng.ko
    /virtiofs.ko
    /nvme.ko
    /nvme-core.ko
    /xfs.ko
    /ext4.ko
    /overlay.ko
    /loop.ko
    /sd_mod.ko
    /scsi_mod.ko
    /ahci.ko
    /vfat.ko
    /nls_cp437.ko
    /nls_iso8859-1.ko
    ^fs/nls/
