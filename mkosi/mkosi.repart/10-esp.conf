# EFI system partition: mkosi installs grub + kernels under /efi and /boot
# in the image tree; CopyFiles pulls them into the ESP at repart time.
# (With custom repart definitions, mkosi's default ESP CopyFiles are absent.)
[Partition]
Type=esp
Label=ESP
SizeMinBytes=1G
SizeMaxBytes=1G
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
